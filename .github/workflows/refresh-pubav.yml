name: Refresh public-site availability
on:
  schedule:
    - cron: '17 2 * * *'   # 10:17 Asia/Taipei daily
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-pubav
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch booked dates from Villa Finder public pages
        run: python3 scripts/refresh_pubav.py
      - name: Commit if changed
        run: |
          git config user.name "outo-bot"
          git config user.email "andrew@outo.co"
          if git diff --quiet -- pubav.js; then echo "no change"; exit 0; fi
          git add pubav.js
          git commit -m "pubav: daily refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break || sleep 20; done
