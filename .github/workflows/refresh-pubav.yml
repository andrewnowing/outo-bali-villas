name: Refresh public-site availability
on:
  schedule:
    - cron: '*/5 * * * *'   # backup trigger; GitHub cron is best-effort and often late
  workflow_dispatch:
    inputs:
      chain:
        description: 'Re-dispatch itself 5 minutes after start (self-paced loop)'
        required: false
        default: 'true'
permissions:
  contents: write
  actions: write
concurrency:
  group: refresh-pubav
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record start time
        run: echo "START_TS=$(date -u +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Fetch booked dates from Villa Finder public pages
        run: python3 scripts/refresh_pubav.py
      - name: Commit if changed
        run: |
          git config user.name "outo-bot"
          git config user.email "andrew@outo.co"
          if git diff --quiet -- pubav.js; then echo "no change"; exit 0; fi
          git add pubav.js
          git commit -m "pubav: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break || sleep 20; done
      - name: Pace to 5 minutes and dispatch the next run
        # always(): the chain must survive a failed fetch (Villa Finder down / blocked), otherwise it dies silently
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.chain != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never hand over to GitHub's cron: it fires sporadically, so stopping the chain on one cron run would kill the loop.
          # Guard against two chains running in parallel: if another dispatch run was queued in the last 3 minutes, stop this one.
          other=$(gh run list -R ${{ github.repository }} -w refresh-pubav.yml --event workflow_dispatch -L 2 --json createdAt,databaseId -q '.[] | select(.databaseId != ${{ github.run_id }}) | .createdAt' | head -1 || true)
          if [ -n "$other" ]; then
            age=$(( $(date -u +%s) - $(date -u -d "$other" +%s) ))
            if [ "$age" -lt 180 ]; then echo "another chain run started ${age}s ago; not chaining"; exit 0; fi
          fi
          # pace from this job's own start time
          now=$(date -u +%s); elapsed=$(( now - START_TS ))
          sleep_for=$(( 300 - elapsed )); if [ "$sleep_for" -gt 0 ]; then sleep "$sleep_for"; fi
          gh workflow run refresh-pubav.yml -R ${{ github.repository }} -f chain=true
        shell: bash
