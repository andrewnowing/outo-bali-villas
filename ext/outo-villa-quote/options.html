<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>Outo Villa 報價 設定</title>
<style>body{font:15px/1.6 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;max-width:520px;margin:28px auto;padding:0 16px;color:#222}
label{display:block;font-weight:600;margin-top:14px}input{width:100%;box-sizing:border-box;font:inherit;padding:8px 10px;border:1px solid #bbb;border-radius:6px}
button{margin-top:12px;font:inherit;padding:8px 18px;border:0;border-radius:6px;background:#1f5fbf;color:#fff;cursor:pointer}
#msg{margin-top:10px;color:#2a7a2a}p{color:#555;font-size:14px}</style></head>
<body>
<h2>Outo Villa 報價</h2>
<p>把查到的 Villa Finder 報價分享給全公司（沒裝擴充功能的同事也會在查詢頁看到）。請向 Andrew 取得共享金鑰，貼在下面存檔即可；不填也能自己看即時報價，只是不會分享。</p>
<label for="token">共享金鑰</label>
<input id="token" type="password" autocomplete="off" placeholder="貼上金鑰">
<button id="save">儲存</button>
<div id="msg"></div>
<script src="options.js"></script>
</body></html>
